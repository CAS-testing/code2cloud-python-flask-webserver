name: Build and Deploy VM Image

# BCE-63729 E2E round 2 (temporary, reverted after the test): re-tag an existing ECR image so a second pipeline
# produces the same digest (multi-pipeline DEPLOYED_BY + stale relation drop).

permissions:
  id-token: write   # This is required for requesting the JWT

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::980573775279:role/github_actions
          aws-region: ${{ vars.AWS_REGION }}

      - name: Authenticate to AWS ECR
        run: |
          aws ecr get-login-password --region ${{ vars.AWS_REGION }} | \
          docker login --username AWS --password-stdin ${{ vars.IMAGE_REGISTRY }}

      - name: Re-tag existing image
        run: |
          docker pull ${{ vars.IMAGE_REGISTRY }}@sha256:d1d5f3040aa8fac68326f24786875e934b0f8e7aceb0c7d982a4800e5ae93acd
          docker tag ${{ vars.IMAGE_REGISTRY }}@sha256:d1d5f3040aa8fac68326f24786875e934b0f8e7aceb0c7d982a4800e5ae93acd ${{ vars.IMAGE_REGISTRY }}:r2-retag-${{ github.sha }}
          docker push ${{ vars.IMAGE_REGISTRY }}:r2-retag-${{ github.sha }}
