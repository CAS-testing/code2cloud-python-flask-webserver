name: Juice Shop Image

on:
  push:
    branches:
      - 'juice-shop'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ECR_REPOSITORY: juice-shop

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::980573775279:role/github_actions
          aws-region: ${{ vars.AWS_REGION }}

      - name: 🔐 Authenticate to AWS ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🏗️ Build Docker Image
        env:
          IMAGE: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        run: |
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest ./juice-shop

      - name: 🚀 Push Docker Image to AWS ECR
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: 🔄 Update Kubeconfig for EKS
        run: aws eks update-kubeconfig --name ${{ vars.EKS_NAME }} --region ${{ vars.AWS_REGION }}

      - name: ☸️ Deploy to EKS
        run: |
          kubectl apply -f manifests/juice-shop.yaml
          kubectl set image deployment/juice-shop juice-shop=$IMAGE:${{ github.sha }} -n default
          kubectl rollout status deployment/juice-shop -n default --timeout=5m
