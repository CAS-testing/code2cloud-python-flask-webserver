apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop
  namespace: default
  labels:
    app: juice-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juice-shop
  template:
    metadata:
      labels:
        app: juice-shop
    spec:
      containers:
        - name: juice-shop
          image: 980573775279.dkr.ecr.us-east-1.amazonaws.com/juice-shop:latest
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: juice-shop
  namespace: default
spec:
  selector:
    app: juice-shop
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer
